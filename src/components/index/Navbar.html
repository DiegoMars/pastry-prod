<!DOCTYPE html>
<html lang="en">
  <head>
    <nav>
      <div class="Navigation">
        <img
          src="Assets/Bg.png"
          alt="Bar"
          height="400px"
          width="100px"
          class="bar"
        />

        <a href="/home" class="home link hover: highlight-image">
          <img src="Assets/Home.png" alt="Home" class="home" />
        </a>

        <a href="/shop" class="shop link hover: highlight-image">
          <img src="Assets/Shop.png" alt="Shop" class="shop" />
        </a>

        <a href="/about" class="about link hover: highlight-image">
          <img src="Assets/AboutUs.png" alt="About Us" class="about" />
        </a>
      </div>
    </nav>

    <style>
      .Navigation {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: fit-content;
        height: 700px;
        padding: 10px;
      }
      .home {
        position: absolute;
        width: 80px;
        height: 80px;
        margin-top: -70px;
      }

      .shop {
        position: absolute;
        width: 80px;
        height: 80px;
        margin-top: 50px;
      }

      .about {
        position: absolute;
        width: 80px;
        height: 80px;
        margin-top: -10px;
      }
      .home:hover,
      .shop:hover,
      .about:hover {
        transform: scale(1.05);
        transition: transform 0.2s;
      }

      .home::before,
      .shop::before,
      .about::before {
        content: "";
        position: relative;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        background-color: rgb(34, 34, 255);
        border-radius: 10px;
        opacity: 10;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>
</html>
